<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sec-grep</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <div class="search-row">
      <input id="search" class="search-input" type="text" placeholder="all papers" value="" autocomplete="off" />
      <div class="sort-bar">
        <button class="sort-btn" data-sort="year">year</button>
        <button class="sort-btn" data-sort="relevance">relevance</button>
        <button class="sort-btn" data-sort="venue">venue</button>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>
  <main class="main">
    <section id="results" class="results"></section>
    <aside id="detail" class="detail"></aside>
  </main>
  <footer class="footer">
    <span>Tab sort · Enter open · ↑↓ move · <code>"phrase"</code> · title:term · venue:ndss · year:2020</span>
  </footer>
</div>
<div id="bibtex-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>BibTeX</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <pre><code id="bibtex-code"></code></pre>
    <div class="modal-actions">
      <button id="modal-copy" class="modal-btn">Copy</button>
      <button id="modal-download" class="modal-btn">Download</button>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
